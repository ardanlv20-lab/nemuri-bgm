<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ねむりBGM"><meta name="theme-color" content="#000">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest">
<title>ねむりBGM</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#eee;font-family:-apple-system,"Hiragino Sans",sans-serif;padding:env(safe-area-inset-top) 12px 24px;transition:background .5s}
h1{font-size:22px;margin:12px 0}#cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-size:18px;color:#eee;background:#1c1f2e;border:2px solid #333a55;border-radius:14px;padding:14px 8px;min-height:56px}
button.on{background:#2d3a8c;border-color:#8fa2ff}#player{width:100%;aspect-ratio:16/9;min-height:200px;margin:12px 0;background:#111}
#now{font-size:16px;min-height:2.6em}.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.row button{flex:1}
#vol{width:100%;height:40px}#remain{font-size:20px;color:#f5d76e}.note{font-size:12px;color:#888;line-height:1.6}
body.dim{background:#000}body.dim>*:not(#pw){opacity:.25}body.dim #pw{filter:brightness(.35)}#dimoff{display:none}body.dim #dimoff{display:block;opacity:1!important;position:fixed;bottom:20px;left:12px;right:12px;z-index:9}
</style></head><body>
<h1>🌙 ねむりBGM</h1>
<div id="cats"></div>
<div id="pw"><div id="player"></div></div>
<div id="now">カテゴリを選んでください</div>
<div class="row"><button id="play">▶ 再生</button><button id="next">⏭ 次へ</button><button id="shuf">🔀 シャッフル: オフ</button></div>
<label>音量 <input id="vol" type="range" min="0" max="100"></label>
<div>スリープタイマー <span id="remain"></span></div>
<div class="row" id="timers"></div>
<div class="row"><button id="dim">🌑 暗くする</button></div>
<button id="dimoff">画面を明るく戻す</button>
<p class="note">・ネット接続が必要です（YouTube公式プレーヤーで再生）<br>・iPhoneは画面ロックやアプリ切替でYouTubeの再生が止まることがあります。「暗くする」で画面をつけたまま使い、設定→画面表示と明るさ→自動ロックを「なし」にすると安定します。</p>
<script src="videos.js"></script><script src="app.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
